[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noticode"
version = "0.1.0"
description = "Autonomous software engineering platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
  { name = "Hüseyin", email = "alnoticode@gmail.com" }
]
dependencies = [
  "pydantic>=2.13,<3.0",
  "typer>=0.27,<1.0",
  "fastapi>=0.141,<1.0",
  "uvicorn>=0.52,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "ruff>=0.16,<1.0",
  "mypy>=2.3,<3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  ".git",
  ".venv",
  "data"
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true
exclude = [
  "^\\.venv/",
  "^data/"
]
